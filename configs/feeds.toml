# Hunter v2 - daily feed universe (phase 1, wave 1).
# Refresh: D:\quant-hunter\.venv\Scripts\python.exe -m quant_hunter.feeds
# Data lands under data_root; nothing is written to C:.

[settings]
data_root = ".local/data/feeds"
history_start = "2000-01-01"

[groups.etf_core]
provider = "yahoo"
kind = "etf"
calendar = "XNYS"
symbols = [
  "SPY", "QQQ", "IWM", "DIA", "EFA", "EEM", "VGK", "EWJ", "FXI", "EWZ",
  "SHY", "IEF", "TLT", "TIP", "LQD", "HYG", "EMB", "BIL",
  "GLD", "SLV", "DBC", "USO", "UNG", "DBA", "VNQ", "UUP",
]

