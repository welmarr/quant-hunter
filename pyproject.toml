[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "quant-hunter"
version = "0.1.0"
description = "Scientifically governed quantitative-research foundation"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "jsonschema>=4.25,<5",
    "referencing>=0.36,<1",
    "rfc3339-validator>=0.1,<1",
    "rfc8785==0.1.4",
]

[dependency-groups]
dev = [
    "hatchling>=1.27,<2",
    "mypy>=1.18,<2",
    "pytest>=8.4,<9",
    "pytest-cov>=7,<8",
    "ruff>=0.12,<1",
    "types-jsonschema>=4.25,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quant_hunter"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "N", "RUF", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers -p no:cacheprovider"
testpaths = ["tests"]
markers = [
    "integration: requires an explicitly configured external service",
]

[tool.coverage.run]
branch = true
source = ["quant_hunter"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
