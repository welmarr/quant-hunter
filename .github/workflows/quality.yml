name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Ubuntu quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          checksum: "173d95a0c32d18c896c46ba6fafbf3cf9c14ab74b033f81b76c883ef492a976b"
          enable-cache: false
      - name: Install Python
        run: uv python install 3.14.7
      - name: Verify lockfile
        run: uv lock --check
      - name: Create locked environment
        run: uv sync --locked --group dev
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Lint
        run: uv run --locked ruff check .
      - name: Type check
        run: uv run --locked mypy src tests
      - name: Test with branch coverage
        run: uv run --locked pytest --cov=quant_hunter --cov-branch --cov-fail-under=90

  windows-compatibility:
    name: Windows compatibility
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          checksum: "f65744f94072152b1f86ba2aace4d01f1124d9a8ecb235805039e3718c36cac2"
          enable-cache: false
      - name: Install Python
        run: uv python install 3.14.7
      - name: Verify and create locked environment
        run: |
          uv lock --check
          uv sync --locked --group dev
      - name: Import package
        run: uv run --locked python -c "import quant_hunter; print(quant_hunter.__version__)"
      - name: Run compatibility tests
        run: uv run --locked pytest
